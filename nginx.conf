worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 16384;
}

http {
  access_log off;

  # Balanceador frente a las réplicas stateless de cada servicio (ADR-04).
  upstream waiting_room {
    server waiting-room-1:3000 max_fails=1 fail_timeout=5s;
    server waiting-room-2:3000 max_fails=1 fail_timeout=5s;
    keepalive 256;
  }

  upstream sales_api {
    server sales-api-1:3000 max_fails=1 fail_timeout=5s;
    server sales-api-2:3000 max_fails=1 fail_timeout=5s;
    keepalive 256;
  }

  server {
    listen 8080 backlog=8192;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 1s;
    # Ingresar a la fila es idempotente (ZADD NX), así que también se reintenta
    # en la otra réplica si una cae.
    proxy_next_upstream error timeout http_502 http_503 non_idempotent;

    location /reserve { proxy_pass http://sales_api; }
    location /seats   { proxy_pass http://sales_api; }
    location /        { proxy_pass http://waiting_room; }
  }
}

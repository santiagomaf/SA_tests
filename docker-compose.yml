name: ticketing-poc

x-waiting-room: &waiting-room
  build: ./waiting-room
  image: ticketing-poc-waiting-room
  environment:
    REDIS_URL: redis://redis:6379
    ADMIT_PER_MIN: ${ADMIT_PER_MIN:-500}
    TOKEN_TTL_S: ${TOKEN_TTL_S:-900}
  volumes:
    - keys-private:/keys:ro
  depends_on:
    redis:
      condition: service_started
    keygen:
      condition: service_completed_successfully

x-sales-api: &sales-api
  build: ./sales-api
  image: ticketing-poc-sales-api
  environment:
    REDIS_URL: redis://redis:6379
  volumes:
    - keys-public:/keys:ro
  depends_on:
    redis:
      condition: service_started
    keygen:
      condition: service_completed_successfully

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # Genera una vez el par de claves ECDSA P-256 del token de admisión.
  # La sala recibe la privada; la API de ventas solo la pública.
  keygen:
    image: node:22-alpine
    volumes:
      - keys-private:/priv
      - keys-public:/pub
    command:
      - node
      - -e
      - |
        const fs = require('fs'), crypto = require('crypto');
        if (!fs.existsSync('/priv/private.pem') || !fs.existsSync('/pub/public.pem')) {
          const k = crypto.generateKeyPairSync('ec', { namedCurve: 'P-256' });
          fs.writeFileSync('/priv/private.pem', k.privateKey.export({ type: 'pkcs8', format: 'pem' }));
          fs.writeFileSync('/pub/public.pem', k.publicKey.export({ type: 'spki', format: 'pem' }));
        }

  waiting-room-1: *waiting-room
  waiting-room-2: *waiting-room

  sales-api-1: *sales-api
  sales-api-2: *sales-api

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PORT:-8090}:8080"
    ulimits:
      nofile: 65535
    depends_on:
      - waiting-room-1
      - waiting-room-2
      - sales-api-1
      - sales-api-2

volumes:
  keys-private:
  keys-public:

networks:
  default:
    name: ticketing-poc
